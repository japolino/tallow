<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tallow preview</title>
  <style>
    :root { --ink: #e8dcc0; --dim: rgba(232, 220, 192, .66); --line: rgba(232, 220, 192, .2); --gold: #f0d08a; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; background: #050403; color: var(--ink); font: 15px/1.45 Georgia, "Times New Roman", serif; overflow: hidden; }
    #host { position: fixed; inset: 0; }
    button { font: inherit; color: inherit; background: rgba(232, 220, 192, .08); border: 1px solid rgba(232, 220, 192, .28); border-radius: 4px; padding: 6px 12px; cursor: pointer; }
    button:hover { background: rgba(232, 220, 192, .18); }
    button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    button[aria-pressed="true"] { background: rgba(240, 208, 138, .28); border-color: var(--gold); }
    a { color: var(--gold); }

    /* The room's own controls (milestone 1). */
    #hud { position: fixed; left: 12px; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 14px; background: rgba(10, 7, 5, .78); border: 1px solid var(--line); border-radius: 6px; backdrop-filter: blur(4px); font-size: 14px; }
    #hud.hidden { display: none; }
    #hud fieldset { border: 0; margin: 0; padding: 0; display: flex; gap: 6px; align-items: center; }
    #hud legend { float: left; padding: 0 6px 0 0; opacity: .7; font-style: italic; }
    #hud button { padding: 5px 10px; }
    #hud input[type="range"] { width: min(260px, 40vw); accent-color: var(--gold); }
    #clock { min-width: 12.5em; font-variant-numeric: tabular-nums; }
    #note { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); padding: 6px 14px; background: rgba(10, 7, 5, .7); border-radius: 4px; opacity: 0; transition: opacity .3s; pointer-events: none; font-size: 16px; }
    #note.on { opacity: 1; }
    #stats { margin-left: auto; opacity: .6; font-variant-numeric: tabular-nums; }

    @media (prefers-reduced-motion: reduce) { #note { transition: none; } }
  </style>
</head>
<body>
  <div id="host"></div>
  <div id="note" role="status" aria-live="polite"></div>


  <form id="hud" class="hidden" onsubmit="return false">
    <fieldset>
      <legend>Time</legend>
      <input id="hour" type="range" min="0" max="24" step="0.05" aria-label="Hour of the day" />
      <span id="clock"></span>
    </fieldset>
    <fieldset>
      <button type="button" data-hour="8">Morning</button>
      <button type="button" data-hour="12.5">Noon</button>
      <button type="button" data-hour="18.3">Golden hour</button>
      <button type="button" data-hour="20.5">Dusk</button>
      <button type="button" data-hour="23">Night</button>
      <button type="button" id="day" aria-pressed="false">Run a day</button>
    </fieldset>
    <fieldset>
      <legend>Weather</legend>
      <button type="button" data-weather="clear" aria-pressed="true">Clear</button>
      <button type="button" data-weather="rain" aria-pressed="false">Rain</button>
      <button type="button" data-weather="storm" aria-pressed="false">Storm</button>
      <button type="button" data-weather="fog" aria-pressed="false">Fog</button>
      <button type="button" data-weather="wind" aria-pressed="false">Wind</button>
      <button type="button" data-weather="snow" aria-pressed="false">Snow</button>
    </fieldset>
    <fieldset>
      <button type="button" id="lean" aria-pressed="false">Lean in over the map</button>
      <button type="button" id="roll">Pick up the die</button>
    </fieldset>
    <a href="./">Play a moment</a>
    <span id="stats"></span>
  </form>
  <script type="module" src="/main.js"></script>
</body>
</html>
